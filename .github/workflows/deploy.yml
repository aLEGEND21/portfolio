name: Deploy

on:
  push:
    branches: [main]

# Never run two deploys at once; queue instead.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: portfolio

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "$IMAGE:${{ github.sha }}" .

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          {
            echo "Host vps"
            echo "  HostName ${{ secrets.DEPLOY_HOST }}"
            echo "  User ${{ secrets.DEPLOY_USER }}"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  StrictHostKeyChecking accept-new"
          } > ~/.ssh/config

      - name: Ship image to VPS
        run: docker save "$IMAGE:${{ github.sha }}" | gzip | ssh vps 'gunzip | docker load'

      - name: Deploy
        run: |
          ssh vps 'mkdir -p /opt/portfolio'
          scp scripts/deploy.sh scripts/rollback.sh vps:/opt/portfolio/
          ssh vps "bash /opt/portfolio/deploy.sh ${{ github.sha }}"
